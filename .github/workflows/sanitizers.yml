name: A/UBSan

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: address and undefined behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # detect_leaks=0: nginx runs the little programs its configure
      # compiles, and with leak detection on each of them reports at exit
      # and returns non-zero, so every feature probe comes out "found but
      # is not working".
      #
      # log_path, because nginx redirects its own stderr onto the error
      # log file and a report written to stderr would be lost there; see
      # the findings step below.
      #
      # Comma separated, and log_path in the middle, both on purpose.
      # Test::Nginx appends the name of each test block to log_path so
      # that every block gets a file of its own, and it cuts the value out
      # with /log_path=([^,]+)/: a colon after the path is read as part of
      # it, and whatever option followed ends up inside the file name,
      # which ASan rejects with "Invalid value for bool option".  That is
      # also why abort_on_error sits here and not on the step's command
      # line.
      ASAN_OPTIONS: detect_leaks=0,log_path=${{ github.workspace }}/sanlog/asan,abort_on_error=0
      # The suppression file names one finding in nginx's own startup
      # path and says why; see ci/ubsan.suppress.  The path has to be
      # absolute, the suite runs nginx from a directory of its own.
      UBSAN_OPTIONS: print_stacktrace=1,halt_on_error=0,suppressions=${{ github.workspace }}/ci/ubsan.suppress,log_path=${{ github.workspace }}/sanlog/ubsan
      # -DNGX_DEBUG_PALLOC=1 is what makes this run able to see the thing
      # it is for.  Without it ngx_palloc and ngx_pnalloc hand out slices
      # of a pool block, so a write past an allocation lands inside a
      # block ASan handed over whole and no report is made; nginx keeps a
      # switch for exactly this and sends every allocation straight to
      # malloc when it is set.
      CI_CC_OPT: '-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -DNGX_DEBUG_PALLOC=1'
      CI_LD_OPT: '-fsanitize=address,undefined'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          packages: redis-server

      - name: Build nginx with both sanitizers
        run: |
          . .github/versions.env
          ci/build.sh "$NGINX_VERSION" "$HOME/nginx"

      - name: Start a Redis for the suite
        run: ci/redis.sh

      - name: Seed the keys the suite reads
        run: ci/seed.sh

      - name: Run the test suite under the sanitizers
        run: |
          set -o pipefail
          mkdir -p sanlog
          TEST_NGINX_NO_SHUFFLE=1 \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" \
            prove -r t/ 2>&1 | tee sanitizer.log

      - name: No findings allowed
        # Also after a failed suite, and above all then: a worker that ASan
        # took down makes the suite fail, and the report that says why is
        # exactly what this step prints.  Without this, the one case worth
        # having the step for is the case where it never runs.
        if: always()
        run: |
          # Both sources.  The sanitizers write where log_path points, and
          # nginx redirects its own stderr onto the error log file as soon
          # as error_log names one, which Test::Nginx always does -- so a
          # grep over the suite's output alone saw ASan only indirectly,
          # through the worker dying, and missed every UBSan report:
          # halt_on_error keeps the process alive and "runtime error:"
          # carries none of the levels Test::Nginx looks for.
          : > sanfindings.txt
          [ -e sanitizer.log ] && cat sanitizer.log >> sanfindings.txt
          for f in sanlog/*; do
            [ -e "$f" ] || continue
            echo "== $f ==" >> sanfindings.txt
            cat "$f" >> sanfindings.txt
          done

          if grep -nE "AddressSanitizer|runtime error:|LeakSanitizer" sanfindings.txt |
            grep -q .
          then
            echo "--- everything the sanitizers wrote ---" >&2
            cat sanfindings.txt >&2
            echo "a sanitizer reported findings, see above" >&2
            exit 1
          fi
          echo "the sanitizers found nothing"
